- name: AlphaAI MCP Server
  description: >-
    Hosted MCP server over Streamable HTTP exposing fifteen tools for news search, ticker news, trending,
    actionable-now, macro, economic calendar, insider news, pair analysis, article retrieval, ticker discovery
    and alert management, plus the ChatGPT deep-research search/fetch contract. OAuth 2.1 with PKCE and
    RFC 7591 dynamic client registration, or the same API key as a bearer token for headless agents. Registered
    in the official MCP registry as io.github.makeev/alphai-mcp.
