name: AlphaAI
description: >-
  A REST API and agent-native platform for relevance-scored, ticker-linked financial news, built for trading bots, agent
  backends, and dashboards. Every article is enriched at ingest with a 1-10 relevance score, one of fourteen categories,
  validated ticker links, and per-ticker sentiment with an impact analysis and confidence rating, plus structured SEC
  Form 4 insider data sourced from EDGAR. The same data core is served three ways — an OpenAPI 3.1 REST API at
  api.alphai.io, a hosted MCP server with OAuth 2.1 and dynamic client registration at mcp.alphai.io, and HMAC-signed
  webhooks on the Pro tier — alongside first-party Python, TypeScript and Rust clients and a provider-published pack of
  Claude Code agent skills.
