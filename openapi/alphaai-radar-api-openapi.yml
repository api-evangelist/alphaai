          type: string
        window_end:
          format: date
          title: Window End
          type: string
        known_at:
          format: date-time
          title: Known At
          type: string
        buyers:
          title: Buyers
          type: integer
        officer_director_buyers:
          title: Officer Director Buyers
          type: integer
        pattern:
          const: open_market
          default: open_market
          title: Pattern
          type: string
        filings_count:
          title: Filings Count
          type: integer
        evidence:
          items:
            $ref: '#/components/schemas/RadarClusterFiling'
          title: Evidence
          type: array
        evidence_truncated:
          title: Evidence Truncated
          type: boolean
      required:
      - window_start
      - window_end
      - known_at
      - buyers
      - officer_director_buyers
      - filings_count
      - evidence
      - evidence_truncated
      title: RadarClusterContext
      type: object
    RadarSnapshot:
      properties:
        snapshot_id:
          title: Snapshot Id
          type: string
        methodology_version:
          title: Methodology Version
          type: string
        research_only:
          default: true
          title: Research Only
          type: boolean
        point_in_time:
          default: false
          title: Point In Time
          type: boolean
        as_of:
          format: date-time
          title: As Of
          type: string
        preview_reference_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Preview Reference At
        freshness:
          $ref: '#/components/schemas/RadarSnapshotFreshness'
        access:
          $ref: '#/components/schemas/RadarSignalAccess'
        window:
          enum:
          - 4h
          - 24h
          title: Window
          type: string
        parameters:
          $ref: '#/components/schemas/RadarCalculationParams'
        limitations:
          items:
            type: string
          title: Limitations
          type: array
        input_hashes:
          additionalProperties:
            type: string
          title: Input Hashes
          type: object
        universe:
