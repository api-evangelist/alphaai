      - methodology_version
      - as_of
      - preview_reference_at
      - freshness
      - access
      - window
      - parameters
      - limitations
      - input_hashes
      - universe
      - summary
      - watchlist_coverage
      - total
      - offset
      - next_offset
      - next_cursor
      - previous_cursor
      - results
      title: SnapshotPreviewDTO
      type: object
    RadarSnapshotFreshness:
