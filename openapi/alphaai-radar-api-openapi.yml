        mode:
          default: historical_preview
          enum:
          - historical_preview
          - live
          title: Mode
          type: string
        effective_delay_seconds:
          title: Effective Delay Seconds
          type: integer
        generated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Generated At
        source_watermark:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Source Watermark
        source_checked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Source Checked At
        unavailable_reason:
          anyOf:
          - type: string
          - type: 'null'
          default: Generation time and source watermarks were not recorded in this export.
          title: Unavailable Reason
      required:
      - effective_delay_seconds
      title: RadarSnapshotFreshness
      type: object
    RadarEvidence:
      properties:
        uid:
          title: Uid
          type: string
        title:
          title: Title
          type: string
        url:
          title: Url
          type: string
        source_domain:
          title: Source Domain
          type: string
        time_published:
          format: date-time
          title: Time Published
          type: string
      required:
      - uid
      - title
      - url
      - source_domain
      - time_published
      title: RadarEvidence
      type: object
    RadarSnapshotSummary:
      properties:
        active_tickers:
          title: Active Tickers
          type: integer
        scored_tickers:
          title: Scored Tickers
          type: integer
        elevated_tickers:
          title: Elevated Tickers
          type: integer
        verified_candidates:
          title: Verified Candidates
          type: integer
