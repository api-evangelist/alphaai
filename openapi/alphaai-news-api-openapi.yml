            additionalProperties: true
        ownership_form:
          type: string
          nullable: true
          enum:
          - direct
          - indirect
          description: SEC Form 4 insider rows only — the holding pool the transaction touched. `null` for non-insider news. A single Form 4 can surface a `direct` and an `indirect` leg of the same plan as two separate articles (same filing URL, same date); they are distinct economic events, so SUM them rather than dedupe by URL/accession.
        created_at:
          type: string
          format: date-time
          description: When AlphAI received the article — NOT its publish time (that is `time_published`). Use it to judge how fresh a pickup is. Do not build "what's new" polling on this field; that is what `sort=ingested` on `/api/news/` and `/api/news/insider/` is for.
        updated_at:
          type: string
          format: date-time
          description: Last time the stored article row was touched (including internal maintenance). Informational only.
