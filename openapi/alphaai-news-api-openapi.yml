        terms_matched:
          type: integer
          nullable: true
          description: In `broadened` mode, how many of the query's words this row carries (at least two); `null` in `strict` mode, where every word matched.
        context:
          type: string
          nullable: true
          description: A fragment of the summary around the matched words, each wrapped in `**…**`; `null` when the match lies in the title or the entity names only.
