openapi: 3.2.0
info:
  title: AlphAI REST News API
  version: 1.52.0
  description: 'Public REST API for AlphAI''s relevance-scored, ticker-linked financial news. All endpoints accept `Authorization: Bearer ak_live_…` (issued from your

    `/account/api-keys`). Authenticated traffic is metered per account with two

    layers — a per-minute burst cap and a per-day volume cap (Free 20/min +

    100/day, Basic 60/min + 10,000/day, Pro 150/min + 100,000/day); a request

    passes only if both are under budget. The Free tier is for evaluation /

    personal non-commercial use; Basic is licensed for internal commercial use;

    Pro adds redistribution of the enriched feed. Send all API traffic to

    `api.alphai.io`; a key is required on every request. The API is server-side only. It sends no CORS headers, so a cross-origin

    call from a browser page fails at the preflight: the `OPTIONS` request is

    answered with `403` at the edge and never reaches the API. Keep the key on

    your server and expose your own route to the browser; a key embedded in

    page code is readable by every visitor and spends your quota. Every keyed response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining`

    and `X-RateLimit-Reset`; these report the per-day volume layer (Reset =

    epoch seconds of the next 00:00 UTC reset) so you can watch your daily budget

    without provoking a 429. A per-minute burst surfaces only as a 429 with a

    short `Retry-After`. A 429 body also names your tier, its caps and an

    `upgrade` block. A request rejected with 429 does not itself spend quota. The headers reflect origin processing, so a response served from a shared

    cache may omit them. On the MCP server (`mcp.alphai.io`) the same two layers meter **tool calls

    only** — the connect handshake (`initialize`, `tools/list`, notifications,

    keepalives, the SSE stream) is protocol traffic and does not consume your

    quota. It carries a separate, far larger ceiling that exists only to stop a

    client reconnecting in a loop; hitting it returns a 429 whose body reports

    `"window": "transport"`, which means your client is reconnecting too often,

    not that you are out of quota. MCP news tools accept `detail="compact"` for headline triage and polling:

    `alphai_news_search`, `alphai_ticker_news`, `alphai_insider_news`,

    `alphai_trending`, `alphai_actionable_now`, `alphai_macro` and

    `alphai_pair_analysis`. Compact items keep identity, source, publication

    and ingest times, tickers, category, relevance_score, top-level

    actionability and information_novelty, story fields, ownership_form and

    search_match. Summary, analysis, images and SEC detail blocks are omitted;

    fetch `alphai_article(uid)` for those details. `detail="full"` is the

    default and preserves the existing format, including the condensed recent

    lists on pair_analysis. Selection, order, cursors, query interpretation

    and macro releases are unchanged, so detail can change between pages. This parameter belongs to MCP tools only; REST parameters are unchanged. Interactive MCP clients use a separate OAuth approval flow. Check the

    callback host or app scheme and full callback address before approving;

    app names are self-declared, not verified by AlphAI. MCP access includes

    news, market data and the saved watchlist, plus creating, changing and

    disabling the user''s own alerts on Basic or Pro (including after an

    upgrade). The OAuth scope `tools.read` is not a read-only restriction. Registered callbacks can be reviewed in Account → MCP connections. That account management surface requires website login, not an API key. Disconnect blocks all existing MCP OAuth access and refresh tokens for that

    app connection, including its other sessions; work already in progress may

    finish. Other connections and API keys are unaffected. Revoking either token

    type through the separate MCP host''s `/oauth/revoke` has the same effect. Serialize refresh requests and save each replacement token: reuse ends the

    connection.'
  contact:
    name: alphai support
    email: support@alphai.io
    url: https://alphai.io/contact
  license:
    name: Proprietary
servers:
- url: https://api.alphai.io
  description: Production (API host — key required)
security:
- apiKey: []
tags:
- name: News
  description: Relevance-scored, ticker-linked news.
paths:
  /api/news/:
    get:
      tags:
      - News
      summary: List news (cursor-paginated)
      description: 'Feed of enriched articles, newest first. Default filter:

        `relevance_score >= 4` AND at least one active ticker. Pagination is

        cursor-based with a default page size of 10 (any size from 1 to 20 via

        `page_size=`; Pro keys go up to 50): omit `cursor` for the newest page,

        then pass the

        `next_cursor` from each response to fetch the next (older) page. `next_cursor: null` means the end of the feed. Cursors are opaque — do

        not construct or parse them; an invalid cursor returns 400. Archive

        depth is tiered: paging back past your plan''s horizon (Free 30 days,

        Basic 90, Pro 180) returns 403 with an upgrade hint. **Delta polling** (`sort=ingested`): the same feed ordered by the

        moment rows became available, for "what is new since my last poll". Articles reach the feed later than their publish time (collection

        median ~30 min for general news, with a long tail), so a poller that

        filters by `time_published` misses most late arrivals; `sort=ingested`

        follows ingest order. First call without `cursor` returns a bounded

        sample of up to `page_size` recent visible rows and a cursor at the

        feed head. This initial sample may be partial or empty when the scan

        reaches its work limit; it still starts the live stream. Each later call with

        the previous `next_cursor` returns only rows added since. In this mode

        `next_cursor` is always non-null — empty `results` means you are

        caught up, keep the cursor and poll again later (responses are cached

        for 60 s, so polling more often than once a minute buys nothing). New

        rows only: an update to an already-delivered article is not re-sent. `time_published` is not monotonic within a delta page; sort client-side

        if you need chronological order. A cursor is only valid with the sort

        mode that issued it. On resumed requests, empty **successful** pages mean the current scan is caught up. A

        nonempty page shorter than `page_size` may still have a continuation;

        keep following its cursor. If a bounded scan cannot produce a page,

        HTTP 409 reports `extra.reason="delta_scan_incomplete"` and

        `extra.next_cursor`. Continue from that cursor with identical filters

        and sort; repeating the original request cannot resolve this work limit. A concurrent change during reading instead returns HTTP 503 with

        `extra.reason="delta_candidates_changed"`: retry the original request,

        without advancing its cursor. Neither error is cached. MCP delta tools

        report the same JSON envelopes as tool errors. The cursor family,

        archive gates and story-collapse behavior remain unchanged. Delta mode carries live coverage only: when we add history in bulk

        (backfilling an earlier period), those rows do NOT enter this stream —

        they would arrive as thousands of "new" items that are months old and

        push your cursor far behind the live feed. They are served normally in

        `sort=published`, by date filters and by `/api/news/{uid}/`, so a

        one-off catch-up over the archive is a published-mode query. **Keeping up.** One call returns at most `page_size` rows, so a poller

        holds its position at the head only while `calls per day × page_size`

        stays above the daily volume of the stream it asked for. Below that it

        falls a little further behind every day, and the symptom misleads:

        `time_published` reads hours or days old while the data is current. What went stale is the cursor, not the feed. So drain instead of

        polling once per tick: when a page comes back with `results` filled,

        call again immediately, and sleep only once `results` is empty. That

        clears a burst within the same cycle and lets a poller catch up by

        itself after downtime. Two levers if the call budget is still short,

        and they multiply: `page_size` (up to 20, or 50 on a Pro key) and a

        narrower stream (`min_relevance`, `symbol`, `category`). For scale, at

        the default `>= 4` floor the feed carries roughly 2,700 rows a day,

        while `min_relevance=7` carries roughly 1,000.'
      parameters:
      - in: query
        name: cursor
        description: Opaque cursor from a prior response's `next_cursor`. Omit for the newest page.
        schema:
          type: string
      - in: query
        name: symbol
        description: Filter to articles that mention this ticker. US equities use the bare symbol (`NVDA`); cryptocurrencies use the `<SYM>-USD` form (`BTC-USD`), and a bare crypto name resolves to it (`DOGE` matches `DOGE-USD`); foreign listings use the Yahoo suffix (`VOD.L`). A delisted symbol returns its news history. A renamed company's current ticker also matches articles tagged with its former ticker, and any share class of an issuer matches articles tagged with its other listed classes (`GOOGL` includes rows tagged `GOOG`); article tags stay as published. `ticker` is accepted as an alias.
        schema:
          type: string
          example: NVDA
      - in: query
        name: category
        description: Keep only these categories. Accepts a single value, a CSV list (`category=earnings,insider`), or a repeated parameter — matches any of them (OR).
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/NewsCategory'
      - in: query
        name: exclude_categories
        description: Drop these categories from the feed. Same single / CSV / repeated forms as `category`.
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/NewsCategory'
      - in: query
        name: min_relevance
        description: Override the default ≥4 threshold.
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 4
      - in: query
        name: page_size
        description: 'Items per page, default `10`. Any value from `1` to `20` is accepted on every tier; `21`-`50` requires a Pro key. A value outside `1`-`50`, or an over-`20` page without a Pro key, returns 400 — the page is never silently clamped. Pagination is otherwise unchanged: pass each response''s `next_cursor` back as `cursor` regardless of page size. `limit` is accepted as an alias.'
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      - in: query
        name: collapse
        description: '`story` collapses coverage of one event to a single representative row (the story root): syndicated reprints and independently written articles about the same event, matched on headline and lead similarity. Populates the `story_id`, `sources_count` and `sources` fields on each item. Omit for the full feed (every article, story fields `null`). Only `story` is accepted; any other value returns 400.

          Note: row-level filters (`symbol`, `category`, `min_relevance`) apply to the story''s representative root, so a story whose root does not match the filter is omitted entirely. The root is the best copy the enricher has seen: a later copy that outscores a weak root (one below 7) takes the root over, so a story''s `story_id` and its place in the feed can move once to that copy; a root at 7 or above is never replaced. An 8-K that carries a press release as its exhibit is a member of that release''s story (same issuer, the release''s headline inside the filing, within 3 hours) when the release itself scores at or above the feed floor, so with `source_type=sec_form8k` a collapsed feed omits such filings — read them uncollapsed. A filing whose release scored below the floor stays its own story.'
        schema:
          type: string
          enum:
          - story
      - in: query
        name: collapse_stories
        description: Boolean alias matching the MCP and Python SDK option. `true` is equivalent to `collapse=story`; `false` leaves articles ungrouped. Send either `collapse` or `collapse_stories`, not both (400).
        schema:
          type: boolean
          default: false
      - in: query
        name: sort
        description: '`published` (default) is the reverse-chronological feed. `ingested` is delta-polling mode: rows in the order they became available, ascending, with `next_cursor` always returned (empty `results` = caught up) — see the endpoint description. All other filters apply unchanged in both modes. Cursors are mode-specific: a cursor is only valid with the sort mode that issued it (a mismatch returns 400).'
        schema:
          type: string
          enum:
          - published
          - ingested
          default: published
      - in: query
        name: from_date
        description: 'Inclusive lower bound on `time_published` — when the article was published, not when it entered the feed. ISO-8601; a value without a timezone is read as UTC. A bare date (`2026-06-01`) means that day''s midnight.

          Reaching further back than your plan''s archive horizon returns 403 (see the `403` response) — the window is subject to the same tiered depth as a deep `cursor`, and on the first page just the same. Cannot be combined with `sort=ingested` (400): delta mode returns rows in ingest order from your cursor and never walks back into history.'
        schema:
          type: string
          format: date-time
        example: '2026-06-01T00:00:00Z'
      - in: query
        name: to_date
        description: Inclusive upper bound on `time_published`, same format as `from_date`. A bare date (`2026-06-01`) covers the WHOLE day (through `23:59:59.999999Z`), so `from_date=2026-06-01&to_date=2026-06-01` returns that day rather than an empty page. `from_date` later than `to_date` returns 400.
        schema:
          type: string
          format: date-time
        example: '2026-06-30T23:59:59Z'
      - in: query
        name: source_type
        description: 'Keep only rows ingested from these sources: `gdelt` (press coverage), `sec_form4` (insider transactions), `sec_form8k` (8-K current reports), `sec_form6k` (a foreign private issuer''s 6-K earnings release). Same single / CSV / repeated forms as `category`, OR-matched. Unknown values return 400. Composes with every other filter: `source_type=sec_form8k&symbol=NVDA` is one company''s 8-Ks, `source_type=gdelt&min_relevance=8` is the press without any filing.'
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/NewsSourceType'
      - in: query
        name: item
        description: 8-K item code, e.g. `5.02` (officer departures/appointments), `8.01` (other events), `1.01` (material agreements). Keeps only 8-K filings that carry the item — ANY item of the filing, not just the one that drove its category — and implies `source_type=sec_form8k`; `item` next to any other `source_type` returns 400 (only 8-Ks have item codes). The category filter already covers the two headline items (`2.02` → `earnings`, `2.01` → `mergers_acquisitions`); `item` is for everything else. A filing SEC served no document for has an empty item list and never matches. Every matched row carries the `filing` block.
        schema:
          type: string
          pattern: ^\d\.\d{2}$
          example: '5.02'
      responses:
        '200':
          description: A page of enriched articles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsPagination'
        '400':
          description: Invalid cursor (opaque; reuse `next_cursor`)
          a cursor replayed into the other `sort` mode: null
          a date window combined with `sort=ingested` or with `from_date` after `to_date`: null
          unsupported `collapse`/`sort` value: null
          a `page_size` outside 1-50 or not permitted on this tier: null
          an unknown `source_type`: null
          a malformed `item`: null
          or `item` combined with a `source_type` other than `sec_form8k`.: null
        '403':
          $ref: '#/components/responses/ArchiveGated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          $ref: '#/components/responses/DeltaScanIncomplete'
        '503':
          $ref: '#/components/responses/DeltaCandidatesChanged'
      operationId: getApiNews
      x-operation-id-source: derived
  /api/news/search/:
    get:
      tags:
      - News
      summary: Full-text search over the feed
      description: 'Search the enriched feed by words. `q` is matched against each

        article''s title, its summary and the entity names the enrichment

        extracted; the page comes back ranked (best match first, newest first

        among equal matches), with a per-item `search_match` and a `query`

        block that says how the words were read. `symbol`, `category`,

        `source_type`, `item`, `min_relevance`, `from_date`, `to_date` and

        `collapse` apply as hard filters on top, exactly as on `/api/news/`:

        `q=director&item=5.02` searches 8-K filings that carry item 5.02,

        `q="going concern"&source_type=gdelt` searches press coverage only.


        **Query syntax.** Bare words are all required (`chip tariffs`); a

        quoted phrase must appear in order (`"going concern"`); `-word`

        excludes (`apple -iphone`); `OR` separates alternatives

        (`nvidia OR amd`). Words in a non-Latin script are ignored. Matching

        tolerates one typo from five letters (`prices` reaches `price`) and a

        prefix on the last word; there is no stemming.


        **Modes** (`query.mode`). `strict`: every word matched. `broadened`:

        the strict pass found fewer than 5 rows and the query has three or

        more words, so the most frequent words were dropped and the page

        carries rows with at least two of the query''s words —

        `search_match.terms_matched` says how many on each; read these as

        leads, not matches. `no_match`: nothing in the searched window.

        `no_terms`: the query held no searchable words. Absence is not proof

        the event did not happen: the searched window starts at

        `query.window_from`.


        **Window and paging.** The searched window is your plan''s archive

        horizon (Free 30 days, Basic 90, Pro 180) unless `from_date` /

        `to_date` narrow it; a window reaching past the horizon returns 403

        like the feed. Results are bounded to the best 200 matches (`matched`

        counts them, capped at 200) and paged with an opaque `cursor` that is

        bound to the query that issued it. Responses are private and never

        shared-cached.


        **Failure.** When the search service does not answer in time the

        endpoint returns 503 with `extra.reason = "search_unavailable"`. The

        structured feed and every other endpoint are unaffected: retry the

        search later rather than the whole chain.'
      parameters:
      - in: query
        name: q
        required: true
        description: The words to search for, 2 to 200 characters (syntax above). `query` is accepted as an alias.
        schema:
          type: string
          minLength: 2
          maxLength: 200
          example: Jane Street
      - in: query
        name: cursor
        description: Opaque cursor from a prior response's `next_cursor`; only valid with the `q` that issued it.
        schema:
          type: string
      - in: query
        name: symbol
        description: Hard ticker filter, same forms and expansions as on `/api/news/` (`ticker` is an alias).
        schema:
          type: string
          example: NVDA
      - in: query
        name: category
        description: Hard category filter — single value, CSV or repeated, OR-matched.
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/NewsCategory'
      - in: query
        name: source_type
        description: 'Keep only rows ingested from these sources, same values and forms as on `/api/news/`: `gdelt` (press coverage), `sec_form4`, `sec_form8k`, `sec_form6k`. Single, CSV or repeated, OR-matched. Unknown values return 400.'
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - gdelt
            - sec_form4
            - sec_form8k
            - sec_form6k
      - in: query
        name: item
        description: '8-K item code, e.g. `5.02`: only 8-K filings carrying that item (any item of the filing). Implies `source_type=sec_form8k`; next to any other `source_type` it returns 400.'
        schema:
          type: string
          pattern: ^\d\.\d{2}$
          example: '5.02'
      - in: query
        name: min_relevance
        description: Override the default ≥4 threshold.
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 4
      - in: query
        name: page_size
        description: Items per page, default `10`; `1`-`20` on every tier, up to `50` on a Pro key (`limit` is an alias).
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      - in: query
        name: collapse
        description: '`story` collapses coverage of one event to its best-ranked article, with `story_id`, `sources_count` and `sources` on each item.'
        schema:
          type: string
          enum:
          - story
      - in: query
        name: collapse_stories
        description: 'Boolean alias: `true` is equivalent to `collapse=story`; `false` leaves articles ungrouped. Send either spelling, not both (400).'
        schema:
          type: boolean
          default: false
      - in: query
        name: from_date
        description: Inclusive lower bound on `time_published` (ISO-8601, UTC when naive; a bare date is that day's midnight). Past your archive horizon → 403.
        schema:
          type: string
          format: date-time
      - in: query
        name: to_date
        description: Inclusive upper bound on `time_published`; a bare date covers its whole day.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: A page of ranked matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsSearchPage'
        '400':
          description: '`q` missing or outside 2-200 characters, an invalid cursor or one issued for another query, a `page_size` outside 1-50 or not permitted on this tier, `from_date` after `to_date`, an unknown `source_type`, a malformed `item` or one combined with a non-8-K `source_type`, or an unsupported `collapse` value.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ArchiveGated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: The search service did not answer in time. The body carries `extra.reason = "search_unavailable"`; the feed endpoints are unaffected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Search is temporarily unavailable; the structured feed at /api/news/ is not affected.
                  extra:
                    type: object
                    properties:
                      reason:
                        type: string
                        enum:
                        - search_unavailable
      operationId: getApiNewsSearch
      x-operation-id-source: derived
  /api/news/trending/:
    get:
      tags:
      - News
      summary: Trending news (last 48h)
      description: 'Top stories from the trailing 48h: `relevance_score >= 8`, ranked by relevance score decayed by article age, so a fresh story outranks an equally-scored stale one. At most two stories per ticker. Fixed size of 10, no pagination. Coverage of one story, syndicated reprints and independent write-ups of the same event alike, is collapsed to a single representative, and each item carries the `story_id`, `sources_count` and `sources` fields for the story it represents. `story_id` is the story ROOT''s uid — the stable story key shared with `?collapse=story` and the MCP tools — while the item itself is the story''s strongest-ranked member, so `story_id` may differ from the item''s own `original.uid`. Most stories are carried by a single outlet, so `sources_count` is usually 1; see its field description.'
      responses:
        '200':
          description: List of enriched articles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RichNewsArticle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getApiNewsTrending
      x-operation-id-source: derived
  /api/news/insider/:
    get:
      tags:
      - News
      summary: Insider-transaction news (SEC Form 4)
      description: 'Dedicated insider feed (`category=insider`): SEC EDGAR Form 4 insider

        activity ONLY — one deterministic-templated row per filing event

        (a filing''s non-derivative trades of one type and holding form,

        aggregated: total shares, volume-weighted average price and executed

        range, total value), surfaced shortly after filing, with the relevance

        score computed from the event''s total (size, buy vs. sell, 10b5-1 plan

        or not). A sale (`transaction_code` `S`) tops out at 6 whatever its

        size, and so does a sale back to the issuer (`D`) that leaves the

        insider with no shares, which is how holdings are cashed out when an

        acquisition closes. Purchases, and a `D` that leaves a holding (the

        company buying back a holder''s block), use the full scale. A sale

        filed without a price stays at 6 too. Same enriched shape, ticker

        and `relevance_score >= 4` filtering, and cursor-based pagination as

        `/api/news/`. Equivalent to `/api/news/?category=insider`, surfaced as a

        first-class route. For aggregate stats instead of the stream, see

        `/api/symbols/{ticker}/insider-summary/`.


        The category is fixed to `insider`. This endpoint does not accept

        `category`, `exclude_categories` or story-grouping parameters; use

        `/api/news/` for those filters.


        To watch for new filings, poll with `sort=ingested` rather than

        re-reading the newest page: a Form 4 is filed up to several days after

        the trade it reports, so a new event often enters the feed already

        below the head of the publish-ordered page. Delta mode orders by the

        moment the row became available, so it never misses one. The contract

        is identical to `/api/news/?sort=ingested` — see that endpoint for the

        full description.'
      parameters:
      - in: query
        name: cursor
        description: Opaque cursor from a prior response's `next_cursor`. Omit for the newest page.
        schema:
          type: string
      - in: query
        name: symbol
        description: Filter to insider news that mentions this ticker. Delisted symbols return their history; a renamed company's current ticker also matches rows tagged with its former ticker. `ticker` is accepted as an alias.
        schema:
          type: string
          example: NVDA
      - in: query
        name: min_relevance
        description: 'Override the default ≥4 threshold. Insider rows score deterministically from the event''s summed dollar value (plus buy/10b5-1 modifiers), and a sale tops out at 6, so this acts as an "only large trades" dial: `min_relevance=6` keeps purchases from roughly $500k and sales from roughly $1M, `min_relevance=7` keeps purchases from roughly $1M and no sales, except a large buyback by the company from a holder who keeps a stake (`transaction_code` `D`). A 10b5-1 plan trade sits one step lower.'
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 4
      - in: query
        name: is_10b5_1
        description: 'Filter on the same field each item''s `insider` block reports: the event''s Rule 10b5-1 status. Omit for every event; `false` returns discretionary trades only — the "hide pre-scheduled sales" dial, since a 10b5-1 ladder was set up months earlier and carries no timing decision; `true` returns plan events only. Event-level, like the field itself: a filing whose group mixes plan and discretionary tranches counts as a plan event on both. The two values partition the feed, so `true` and `false` pages always add up to the unfiltered one.'
        schema:
          type: boolean
      - in: query
        name: page_size
        description: Items per page, default `10`. Any value from `1` to `20` is accepted on every tier; `21`-`50` requires a Pro key. A value outside `1`-`50`, or an over-`20` page without a Pro key, returns 400. `limit` is accepted as an alias.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      - in: query
        name: sort
        description: '`published` (default) is the reverse-chronological feed. `ingested` is delta-polling mode, with the same contract as on `/api/news/`: rows in the order they became available, ascending, `next_cursor` always returned (empty `results` = caught up), and all other filters applied unchanged. Prefer it for watching insider activity — a Form 4 is filed days after the trade it reports, so a new event routinely lands below the newest page of the publish-ordered feed and a poller reading only the head misses it. Cursors are mode-specific: a cursor is only valid with the sort mode that issued it (a mismatch returns 400).'
