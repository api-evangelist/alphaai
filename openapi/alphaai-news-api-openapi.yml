          type: string
          format: date-time
        example: '2026-06-01T00:00:00Z'
      - in: query
        name: to_date
        description: Inclusive upper bound on `time_published`. A bare date covers the whole day; same clock caveat as `from_date`.
        schema:
          type: string
          format: date-time
        example: '2026-06-30T23:59:59Z'
      - in: query
        name: format
        description: 'Response format. `json` (default) is the page described below.

          `csv` streams the same feed as a file: one row per insider event,

          the same filters (`symbol`, `min_relevance`, `is_10b5_1`,

          `from_date`/`to_date`, `sort`, `cursor`), walked page by page on

          the server up to your plan''s **row cap** — Free 500, Basic 2 000,

          Pro 10 000 rows per file — inside your plan''s archive horizon

          (30 / 90 / 180 days). `page_size` has no effect on CSV. One

          request counts once against your rate limit, whatever the file''s

          length.


          Where a JSON page past the horizon returns 403, the file stops at the horizon and the

          response headers say so (`X-Alphai-Truncated: archive_horizon`).

          Validation errors (a bad cursor, an inverted window, a window with

          `sort=ingested`) are the same 400 JSON bodies as for `format=json`,

          sent before any row.


          Concurrent feed changes or a connection error can interrupt the

          stream after headers are sent. Accept a file only after the stream

          completes and the number of parsed CSV data rows matches

          `X-Alphai-Rows`. Otherwise discard the partial file and retry the

          original request; do not advance to `X-Alphai-Next-Cursor`.


