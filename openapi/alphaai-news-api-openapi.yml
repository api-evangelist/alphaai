          `Content-Disposition: attachment; filename="alphai-insider-<date>.csv"`,

          `Cache-Control: private, no-store`, plus the `X-Alphai-*` headers

          listed under the 200 response: `X-Alphai-Rows` (data rows in the

          file), `X-Alphai-Row-Cap` (your plan''s cap), `X-Alphai-Truncated`

          (`row_cap` — more rows exist, continue with the cursor;

          `archive_horizon` — the walk reached your plan''s archive depth;

          `false` — the file holds everything the filters select) and

          `X-Alphai-Next-Cursor` (present when there is more: the same token

          a JSON page would have returned at that position, so you can

          continue in either format).


          Columns, in order: `uid`, `time_published`, `tickers`

          (`|`-joined), `title`, `url`, `category`, `relevance_score`,

          `side`, `transaction_code`, `shares`, `avg_price_usd`,

          `total_value_usd`, `is_10b5_1`, `insider_name`, `insider_title`,

          `is_officer`, `is_director`, `is_ten_percent_owner`,

          `transaction_date`, `filed_at`, `late_filing`, `summary` — the

          JSON item''s fields and its `insider` block flattened (event

          columns are empty for a row without a block). RFC 4180 quoting,

          LF line endings, UTF-8, timestamps in ISO 8601 UTC (`Z`),

          booleans `true`/`false`, an empty cell for null, never the article

          body. A free-text cell that begins with `=`, `+`, `-`, `@` or a

          tab is prefixed with an apostrophe so it cannot run as a formula

          when the file is opened in a spreadsheet.


