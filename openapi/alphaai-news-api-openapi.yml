          header on its own still returns JSON, and a client that sends

          `Accept: application/json` together with `format=csv` gets 406.

          With `sort=ingested` and no cursor the file holds the newest rows

          (up to the cap) in ingest order and the cursor parks at the head,

          like the JSON prime page; with a cursor it holds everything since

          that position, with rows older than your archive horizon skipped

          and reported as `archive_horizon`.

          '
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
      responses:
        '200':
          description: 'A page of enriched insider-transaction articles. Each item additionally carries the structured `insider` event block (side / shares / average price / total value / reporting owner) — populated on this endpoint only. With `format=csv`, the same rows as a streamed CSV file: see the `format` parameter for the columns, the per-plan row caps and the `X-Alphai-*` headers.'
          headers:
            X-Alphai-Rows:
              description: '`format=csv` only. Data rows in the file (the header line is not counted).'
              schema:
                type: integer
            X-Alphai-Row-Cap:
              description: '`format=csv` only. Your plan''s rows-per-file cap (Free 500, Basic 2 000, Pro 10 000).'
              schema:
                type: integer
            X-Alphai-Truncated:
              description: '`format=csv` only. Why the file ended: `row_cap` (more rows exist; continue with `X-Alphai-Next-Cursor`), `archive_horizon` (the walk reached your plan''s archive depth), or `false` (the file holds everything the filters select).'
