    InsiderEvent:
      type: object
      description: 'Structured SEC Form 4 event: the aggregate of the news row''s whole transaction group (one row fronts a filing''s non-derivative trades of one type and holding form, so a 10b5-1 ladder is ONE event). `shares` and `total_value_usd` are group sums; `avg_price_usd` is the value-weighted average over priced tranches. Money and share fields are decimal STRINGS to preserve precision.'
      required:
      - side
      - transaction_code
      - shares
      - is_10b5_1
      - insider_name
      - insider_title
      - is_officer
      - is_director
      - is_ten_percent_owner
      - transaction_date
      - filed_at
      - late_filing
      properties:
        side:
          type: string
          enum:
          - buy
          - sell
          - other
          description: 'Signal label from the transaction code: `buy` (P, open-market purchase), `sell` (S, open-market sale), `other` for everything else — including D (sale to the issuer: a buyback/redemption, not an open-market disposition). Use `transaction_code` for your own mapping.'
        transaction_code:
          type: string
          description: Raw SEC Form 4 transaction code (`P`, `S`, `D`, …).
          example: S
        shares:
          type: string
          description: Total shares across the event's tranches (decimal string).
          example: '25000'
        avg_price_usd:
          type: string
          nullable: true
          description: Value-weighted average price per share over priced tranches. `null` when the filing prices no tranche.
          example: '187.32'
        total_value_usd:
          type: string
          nullable: true
          description: Total USD value across priced tranches (a lower bound when some tranches are unpriced). `null` when no tranche is priced.
          example: '4683000'
        is_10b5_1:
          type: boolean
          description: 'True when any tranche executed under a pre-arranged 10b5-1 plan. Filterable on this endpoint: `?is_10b5_1=false` keeps only discretionary events.'
        insider_name:
          type: string
          example: STEVENS MARK A
        insider_title:
          type: string
          example: Director
        is_officer:
          type: boolean
        is_director:
          type: boolean
        is_ten_percent_owner:
          type: boolean
        transaction_date:
          type: string
          format: date
          description: Date of the group's last fill (a ladder can span days).
          example: '2026-07-09'
        filed_at:
          type: string
          format: date-time
          description: When EDGAR accepted the filing (UTC). Compare against `transaction_date` for your own lateness rule.
          example: '2026-07-11T20:31:04Z'
        late_filing:
          type: boolean
          description: 'The filing missed the SEC''s two-business-day deadline (Rule 16a-3(g)). Computed on Eastern dates, since EDGAR accepts filings until ~22:00 ET, and with one weekday of slack so a trade in a holiday week is not flagged: true when more than three weekday-days separate `transaction_date` from the filing. About 3% of events carry it; the long tail is catch-up filings covering trades from years earlier.'
    Topic:
      type: object
      required:
      - topic
      - relevance
      properties:
        topic:
          type: string
        relevance:
          type: number
          format: float
    NewsSourceType:
      type: string
      description: 'Where a row was ingested from, the axis the `source_type` filter on `/api/news/` selects on. `gdelt` is press coverage (every publisher channel: the GDELT stream, RSS feeds, directly parsed publisher pages); `sec_form4` an insider transaction (`category` `insider`); `sec_form8k` an 8-K current report (carries the `filing` block, filterable by `item`); `sec_form6k` a foreign private issuer''s 6-K earnings release. The row''s `original.source` names the outlet or the SEC form in words.'
      enum:
      - gdelt
      - sec_form4
      - sec_form8k
      - sec_form6k
    Confidence:
      type: string
      enum:
      - high
      - medium
      - low
    InsiderCluster:
      type: object
      description: One issuer's run of Form 4 purchases and its verdict. Money fields are decimal STRINGS. `buyers` counts independent buyers (the cluster); `buyers_total` everyone who bought, including plan, unpriced and duplicate reporters.
      required:
      - ticker
      - name
      - cik
      - window_start
      - window_end
      - known_at
      - buyers
      - buyers_total
      - officer_director_buyers
      - ten_percent_owner_buyers
      - fills
      - filings
      - total_usd
      - value_partial
      - distinct_dates
      - distinct_prices
      - pattern
      - pattern_reasons
      - buyers_detail
      - filings_detail
      properties:
        ticker:
          type: string
          example: AMRZ
        name:
          type: string
          example: Amrize Ltd
        cik:
          type: integer
          description: SEC Central Index Key of the issuer.
        window_start:
          type: string
          format: date
          description: First purchase date of the episode.
        window_end:
          type: string
          format: date
          description: Last purchase date of the episode.
        known_at:
          type: string
          format: date-time
          description: When the episode's latest filing reached EDGAR — the clock `days` is measured on.
        buyers:
          type: integer
          description: Independent buyers.
        buyers_total:
          type: integer
          description: Every distinct reporting owner after duplicate merging.
        officer_director_buyers:
          type: integer
          description: Independent buyers who are an officer or director.
        ten_percent_owner_buyers:
          type: integer
          description: Independent buyers flagged as 10% owners.
        fills:
          type: integer
          description: Purchase tranches counted (a transaction reported twice is counted once).
        filings:
          type: integer
          description: Distinct Form 4 filings.
        total_usd:
          type: string
          nullable: true
          description: Sum of the counted tranches' values (decimal string); `null` when no tranche carries a price.
        value_partial:
          type: boolean
          description: '`true` when at least one counted tranche has no price, so `total_usd` understates the episode.'
        distinct_dates:
          type: integer
        distinct_prices:
          type: integer
          description: Distinct prices to the cent across priced tranches.
        pattern:
          type: string
          enum:
          - open_market
          - plan_or_offering
          - holders_only
        pattern_reasons:
          type: array
          items:
            type: string
          description: Machine-readable notes behind the verdict, e.g. `mass_uniform_date_price`, `same_price_across_dates`, `one_price_multi_date`, `plan_like_buyers`, `off_market_buyers` (a buyer whose filing says placement / offering / private), `unpriced_buyers`, `duplicate_filings`, `no_officer_or_director`.
        buyers_detail:
          type: array
          items:
            $ref: '#/components/schemas/ClusterBuyer'
        filings_detail:
          type: array
          items:
            $ref: '#/components/schemas/ClusterFiling'
    NewsContextEnhancement:
      type: object
      properties:
        background_context:
          type: string
        impact_analysis:
          type: string
        key_entities:
          type: array
          items:
            $ref: '#/components/schemas/KeyEntity'
        market_relevance_summary:
          type: string
        estimated_read_time_minutes:
          type: integer
    Sentiment:
      type: string
      enum:
      - positive
      - neutral
      - negative
    KeyEntity:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          example: company
        description:
          type: string
    BriefEarningsDateDTO:
      properties:
        ticker:
          title: Ticker
          type: string
        report_date:
          format: date
          title: Report Date
          type: string
      required:
      - ticker
      - report_date
      title: BriefEarningsDateDTO
      type: object
    ClusterBuyer:
      type: object
      required:
      - name
      - title
      - is_officer
      - is_director
      - is_ten_percent_owner
      - role
      - reason
      - duplicate_of
      - fills
      - usd
      - first_date
      - last_date
      - news_uids
      properties:
        name:
          type: string
          example: Jenisch Jan Philipp
        title:
          type: string
          example: Chairman & CEO
        is_officer:
          type: boolean
        is_director:
          type: boolean
        is_ten_percent_owner:
          type: boolean
        role:
          type: string
          enum:
          - independent
          - plan_like
          - unpriced
          - duplicate_of
          description: '`independent` counts toward the cluster. `plan_like`: the buyer''s fills all share an exact date-and-price pair with another buyer''s (an allocation, an ESPP/DRIP lot), match another direct holder''s lot at a round price, or the filing itself says the shares were not bought on the open market (then `reason` is set). `unpriced`: no fill carries a price (units, exchanges). `duplicate_of`: the same transaction another reporter already reported; `duplicate_of` names that reporter.'
        reason:
          type: string
          nullable: true
          enum:
          - placement
          - offering
          - private
          - null
          description: 'Set on a `plan_like` buyer when the Form 4''s own footnotes or remarks decided it: `placement` — bought from the issuer (a PIPE, a subscription or securities purchase agreement, SPAC sponsor units); `offering` — allocated in a public offering or IPO; `private` — a negotiated block from another holder (a stock transfer agreement, a private transaction). Null when the price shape alone decided the role. Read by the collector since 2026-09-26; earlier filings are backfilled for 90 days.'
        duplicate_of:
          type: string
          nullable: true
        fills:
          type: integer
        usd:
          type: string
          nullable: true
          description: Sum of this buyer's priced fills (decimal string).
        first_date:
          type: string
          format: date
        last_date:
          type: string
          format: date
        news_uids:
          type: array
          items:
            type: string
          description: The `uid`s of the insider news rows fronting this buyer's filings — fetch `/api/news/{uid}/` for the event.
    Actionability:
      type: string
      enum:
      - high
      - medium
      - low
      - negligible
    NewsSearchPage:
      type: object
      required:
      - results
      - count
      - matched
      - query
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RichNewsArticle'
          description: Feed items in rank order, each with `search_match`.
        next_cursor:
          type: string
          nullable: true
          description: Pass back as `cursor` for the next page; `null` past the 200-match bound.
        count:
          type: integer
          description: Items on this page.
        matched:
          type: integer
          description: Visible matches in the bounded candidate set (at most 200); never a global total.
        query:
          $ref: '#/components/schemas/NewsSearchQueryInfo'
    InsiderClustersPage:
      type: object
      required:
      - results
      - next_cursor
      - meta
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/InsiderCluster'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page (pass back with the same `sort`); `null` at the end.
        meta:
          $ref: '#/components/schemas/InsiderClustersMeta'
    NewsTradingValue:
      type: object
      properties:
        actionability_score:
          $ref: '#/components/schemas/Actionability'
        information_novelty:
          type: integer
          minimum: 0
          maximum: 10
          description: 'How much NEW information the article carries (1–10), kept separate from relevance: a mega-cap post-earnings recap is high relevance but low novelty. 0 on rows enriched before the field existed.'
        timing_relevance:
          type: string
        market_sentiment_alignment:
          type: string
        estimated_read_time:
          type: string
    NewsPagination:
      type: object
      required:
      - results
      - next_cursor
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RichNewsArticle'
        next_cursor:
          type: string
          nullable: true
          description: 'Opaque cursor for the next page. Pass it back as `?cursor=` with the same `sort` mode. Default (`sort=published`) feed: the next older page, `null` when the end of the feed has been reached. Delta mode (`sort=ingested`): always non-null — it is your polling position; empty `results` means caught up, keep the cursor and poll again later.'
        symbol_note:
          type: string
          nullable: true
          example: '''BTC'' is Grayscale Bitcoin Mini Trust ETF (a stock/ETF ticker). The cryptocurrency with this symbol trades as BTC-USD — request BTC-USD for coin news.'
          description: Crypto-collider hint, set only when `symbol` named a string a stock/ETF owns while an active cryptocurrency answers to the same base (crypto is addressed as `<SYM>-USD`, so `BTC` is the Grayscale ETF and `BTC-USD` the coin). One sentence naming the coin ticker to request; `null` for every other query. The page itself still serves the equity's feed — the string keeps its equity meaning.
  responses:
    ArchiveGated:
      description: 'The request reaches past your plan''s news-archive horizon (Free 30

        days, Basic 90, Pro 180) — either the `cursor` points beyond it, or

        `from_date` does. The body''s `extra` carries `reason: archive_horizon`,

        your `tier`, the plan''s `archive_days`, and (below Pro) an `upgrade`

        block with the higher tiers'' caps and the pricing URL.


        The window is checked on the FIRST page, unlike the cursor: a

        `from_date` older than the horizon is refused immediately rather than

        after paging down to it. A window with only `to_date` is refused when

        that bound itself is past the horizon (the window is open-ended into

        the past). Windows and cursors inside the horizon are unaffected, and

        the request is refused rather than trimmed to the horizon, so a given

        URL always returns the same body.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DeltaCandidatesChanged:
      description: 'Delta candidates changed between selection and reading. `extra.reason`

        is `delta_candidates_changed`; no continuation cursor is returned.

        Retry the original request with the same cursor and filters.

        '
      headers:
        Cache-Control:
          description: The interrupted scan must not be cached.
          schema:
            type: string
            example: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Delta candidates changed during the scan. Retry with the original cursor and filters.
            extra:
              reason: delta_candidates_changed
    NotFound:
      description: No item with that identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DeltaScanIncomplete:
      description: 'A resumed JSON delta scan consumed its work allowance without finding

        visible rows or reaching the head. `extra.reason` is

        `delta_scan_incomplete`. Continue from `extra.next_cursor` with identical

        filters and sort; only invisible candidates were consumed. Do not retry

        the old cursor or treat this error as caught up. Existing SDK iterators

        raise a conflict error; applications must explicitly resume from the

        cursor in its `extra`. CSV follows these continuations internally.

        '
      headers:
        Cache-Control:
          description: The incomplete scan must not be cached.
          schema:
            type: string
            example: private, no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Delta scan reached its work limit. Continue with next_cursor and the same filters and sort.
            extra:
              reason: delta_scan_incomplete
              next_cursor: opaque-continuation-token
    RateLimited:
      description: 'Rate limit exceeded — either the per-minute burst cap or the per-day

        volume cap. The `Retry-After` header is the earliest second a retry can

        succeed, not a guess (a burst

        block is short, ≤60s; a day-cap block is capped at 3600s — the true reset

        is `X-RateLimit-Reset`). The `X-RateLimit-*` trio shows the daily volume

        budget. The body''s `extra` names your tier, its `limit_per_minute` /

        `limit_per_day`, `retry_after_seconds`, and — below Pro — an `upgrade`

        block with the higher tiers'' caps and the pricing URL. A rejected

        request does not itself consume quota, so retrying after `Retry-After`

        costs you nothing extra.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying (burst ≤60s; day cap ≤3600s).
          schema:
            type: integer
        X-RateLimit-Limit:
          description: The tier's per-day request volume.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Requests left in today's volume budget.
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Epoch seconds of the next 00:00 UTC reset.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: ak_live_*
      description: 'Token of the form `ak_live_<random>`. Issued from

        `/account/api-keys` on the website. Send as `Authorization: Bearer …`.

        '
