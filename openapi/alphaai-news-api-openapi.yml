          nullable: true
          allOf:
          - $ref: '#/components/schemas/EightKFiling'
          description: '`/api/news/` and `/api/news/{uid}/` — the structured SEC 8-K filing block, present on every row whose source is an 8-K (`original.source` is `SEC EDGAR 8-K`; filter them with `source_type=sec_form8k` or `item=`). `null` on press, Form 4 and 6-K rows, on the other endpoints, and on the rare 8-K row without structured data.'
    NewsCategory:
      type: string
      description: '`market_movers` is for articles whose subject IS a notable price move ("AMD up 5% today"); `sector_analysis` is genuine sector-level analysis; `insider` covers SEC Form 4 insider transactions only. SEC 8-K filings categorize by their primary item: an earnings release (Item 2.02) is `earnings`, a completed acquisition or disposition (Item 2.01) is `mergers_acquisitions`, and the remaining events (material agreements, debt, executive changes, annual-meeting results, and since 2026-09-17 securities offerings, Regulation FD disclosures and other events under Items 7.01/8.01) are `corporate_actions`. A foreign private issuer''s SEC 6-K appears only when it is an earnings release (`source` "SEC EDGAR 6-K") and is always `earnings`.'
      enum:
      - earnings
      - mergers_acquisitions
      - regulation
      - macro_economy
      - sector_analysis
      - market_movers
      - technology
      - commodities
      - crypto
      - ipo
      - geopolitics
      - insider
      - corporate_actions
      - other
    ImpactAnalysis:
      type: object
      properties:
        summary:
          type: string
        sentiment:
          $ref: '#/components/schemas/Sentiment'
        price_impact_prediction:
          type: string
        confidence:
          $ref: '#/components/schemas/Confidence'
        reasoning:
          type: string
    Error:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
        detail:
          type: string
        extra:
          type: object
          description: 'Machine-readable context on capped responses: the 429 carries `tier`, `limit_per_minute`, `limit_per_day`, `retry_after_seconds`; the archive 403 carries `reason: archive_horizon`, `tier`, `archive_days`. Both include an `upgrade` object (higher tiers'' caps + `pricing_url`) for callers below Pro. A 400 caused by an unknown query parameter additionally carries `allowed_params` — the complete list this endpoint accepts, read straight off the endpoint''s own schema — plus `docs`, a link to the developer reference. Individual entries in `extra.fields` may carry a did-you-mean hint in their `msg`.'
    NewsSearchQueryInfo:
      type: object
      description: How `/api/news/search/` read the query.
      required:
      - mode
      - sort
      - terms
      properties:
        mode:
          type: string
          enum:
          - strict
          - broadened
          - no_match
          - no_terms
          description: See the endpoint description.
        sort:
          type: string
          enum:
          - relevance
          - published
          description: '`relevance` (ranked) or `published` (newest first) — the latter when every word is too common to rank on.'
        terms:
          type: array
          items:
            type: string
          description: The normalized words that were searched.
        required_terms:
          type: array
          items:
            type: string
          description: In `broadened` mode, the words at least one of which every row carries, when the search reports them; empty otherwise (the current engine does not — `search_match.terms_matched` on each item is the count to trust).
        optional_terms:
          type: array
          items:
            type: string
        window_from:
          type: string
          format: date-time
          nullable: true
          description: Start of the searched window (your archive horizon, or `from_date` if later).
        note:
          type: string
          description: One sentence for an agent to act on — what selected the rows, and what they are not.
    AlternativePerspectives:
      type: object
      properties:
        contrarian_view:
          type: string
        overlooked_factors:
          type: string
    IndirectMarketEffects:
      type: object
      properties:
        sector_implications:
          type: string
        regional_market_impact:
          type: string
        global_market_relevance:
          type: string
    EarningsReport:
      type: object
      description: AlphAI's own structured analysis of an earnings release (SEC Form 8-K item 2.02, or Form 6-K for a foreign private issuer — half-year and full-year periods, IFRS and non-USD figures copied as reported). Every figure was cross-checked against the filing text before storage; consensus estimates and price targets are omitted because they are not in the filing. MCP `alphai_article` returns the structured read; connector `fetch` includes its metrics, comparisons, segments, guidance and limitations in the citation-ready `text` when a completed read exists.
      required:
      - company
      - ticker
      - fiscal_period
      - headline
      - verdict
      - key_metrics
      - analysis
      properties:
        company:
          type: string
        ticker:
          type: string
        fiscal_period:
          type: string
          example: Second Quarter Fiscal 2027
        period_end:
          type: string
          nullable: true
        headline:
          type: string
        verdict:
          type: string
          enum:
          - strong
          - solid
          - mixed
          - weak
        verdict_reason:
          type: string
        key_metrics:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
                example: $96.2 billion
                description: The figure exactly as the filing printed it — this is the string that was verified against the document, so a table in millions arrives as `$19,345` and a press-release line as `$6.76 billion`. Use the three companions below to compute.
              basis:
                type: string
                enum:
                - GAAP
                - non-GAAP
                - other
              prior_year:
                type: string
                nullable: true
              prior_quarter:
                type: string
                nullable: true
              yoy_change:
                type: string
                nullable: true
              qoq_change:
                type: string
                nullable: true
              numeric:
                type: number
                nullable: true
                example: 96.2
                description: '`value` as a number at the face scale it was printed, sign applied (`$(5,396)` → -5396). Null when `value` carries no figure. The amount in base units is `numeric` × the `scale` multiplier (thousands 1e3, millions 1e6, billions 1e9).'
              unit:
                type: string
                nullable: true
                example: USD
                description: ISO-style currency code (`USD`, `EUR`, `TWD`, `CNY`, …), `pct` for a percentage, `bp` for basis points, null for a plain count (shares, units, multiples).
              scale:
                type: string
                nullable: true
                enum:
                - ones
                - thousands
                - millions
                - billions
                - trillions
                description: 'The multiplier `numeric` is expressed in. Filled only when something in the filing says it: the printed value (`$6.76 billion`, `$60,801 (In millions)`), the metric name, the row''s own prior figure, the same amount printed with its unit in the filing''s prose, or the filing''s table header when it names one scale for its tables. Per-share and percentage figures are `ones`; a per-unit metric (revenue per customer, a price per ounce) never takes a table''s scale. Null means the filing did not say — treat `numeric` as unscaled at your own risk rather than assume millions. Added 2026-09-12; the rules were tightened and every stored read recomputed on 2026-10-01.'
        segments:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              revenue:
                type: string
                example: $18,002
                description: The segment's figure exactly as the filing printed it. A segment table names its unit in the header far more often than in the cell, so use the three companions below to compute.
              yoy_change:
                type: string
                nullable: true
              qoq_change:
                type: string
                nullable: true
              driver:
                type: string
              numeric:
                type: number
                nullable: true
                example: 18002
                description: '`revenue` as a number at the face scale it was printed. Null when the field carries no figure.'
              unit:
                type: string
                nullable: true
                example: USD
                description: ISO-style currency code, `pct` for a percentage, null when the cell prints no currency (or holds a volume, such as units delivered).
              scale:
                type: string
                nullable: true
                enum:
                - ones
                - thousands
                - millions
                - billions
                - trillions
                description: The multiplier `numeric` is expressed in, by the same rules as a `key_metrics` row. A bare segment figure takes the table header's scale only when the segments then fit under the read's own revenue line; otherwise null. Added 2026-10-01 to every stored read.
        guidance:
          type: object
          nullable: true
          properties:
            period:
              type: string
            revenue:
              type: string
              nullable: true
            gross_margin:
              type: string
              nullable: true
            operating_expenses:
              type: string
              nullable: true
            tax_rate:
              type: string
              nullable: true
            other:
              type: array
              items:
                type: string
        vs_prior_guidance:
          type: array
          description: Reported figure vs the company's own prior outlook, when available.
          items:
            type: object
            properties:
              metric:
                type: string
              prior_guidance:
                type: string
              actual:
                type: string
              verdict:
                type: string
                enum:
                - above
                - in line
                - below
                - n/a
        capital_returns:
          type: array
          items:
            type: string
        balance_sheet_cash_flow:
          type: array
          items:
            type: string
        drivers:
          type: array
          items:
            type: string
        concerns:
          type: array
          items:
            type: string
        what_to_watch:
          type: array
          items:
            type: string
        quotes:
          type: array
          items:
            type: object
            properties:
              speaker:
                type: string
              role:
                type: string
                nullable: true
              text:
                type: string
        analysis:
          type: string
          description: Several paragraphs of grounded analysis.
        missing_items:
          type: array
          items:
            type: string
          description: What the filing did NOT state, named rather than guessed.
        numbers_verified_from_document:
          type: boolean
        table_scale:
          type: string
          nullable: true
          enum:
          - thousands
          - millions
          - billions
          description: 'The unit the filing''s own table headers name (`(In millions, except per share data)`). The prose and list fields (`analysis`, `balance_sheet_cash_flow`, `capital_returns`, `concerns`, …) quote table figures as printed, so in a read with `table_scale: millions` a bare `$36,197` there is $36,197 million; per-share figures are always as printed. Null when the headers name no unit or name two without a clear majority. Added 2026-10-01 to every stored read.'
    TickerAnalysis:
      type: object
      properties:
        ticker:
          type: string
        relevance_context:
          type: string
        impact_analysis:
          $ref: '#/components/schemas/ImpactAnalysis'
    AITradingInsights:
      type: object
      properties:
        ticker_analysis:
