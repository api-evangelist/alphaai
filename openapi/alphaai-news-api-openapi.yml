        description: 'Inclusive lower bound on `time_published`, identical in format and behaviour to the parameter on `/api/news/` (ISO-8601, naive read as UTC, tier-gated with 403, refused with `sort=ingested`).

          Note which clock it is: `time_published` is when the filing reached the feed, NOT the insider''s `transaction_date` reported in the `insider` block. A Form 4 is filed days after the trade, so a window over trade dates is a different question and this parameter does not answer it.'
