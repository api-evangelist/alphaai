        alternative_perspectives:
          $ref: '#/components/schemas/AlternativePerspectives'
    ClusterFiling:
      type: object
      required:
      - accession_number
      - filed_at
      - sec_url
      properties:
        accession_number:
          type: string
          example: 0002035989-26-000078
        filed_at:
          type: string
          format: date-time
        sec_url:
          type: string
          format: uri
          description: The filing's EDGAR index page.
    EightKFiling:
      type: object
      description: 'Structured SEC 8-K filing: what the filing itself says, next to the AI read of it. One news row fronts one filing.'
      required:
      - items
      - accession_number
      - filed_at
      properties:
        items:
          type: array
          items:
            type: string
          description: Every item code the filing carries, in the filing's order (`["5.02", "9.01"]`). `?item=` matches any of them. Empty for a filing SEC served no document for (header-only).
          example:
          - '5.02'
          - '9.01'
        primary_item:
          type: string
          nullable: true
          description: The item that drove the row's `category` (`2.02` → `earnings`, `2.01` → `mergers_acquisitions`, the rest → `corporate_actions`). `null` when the filing lists no items.
          example: '5.02'
        accession_number:
          type: string
          description: SEC accession number of the filing — the id to cite.
          example: 0001193125-26-231145
        filed_at:
          type: string
          format: date-time
          description: When EDGAR accepted the filing (UTC).
          example: '2026-09-18T20:05:12Z'
        event_date:
          type: string
          format: date
          nullable: true
          description: The filing's own "date of report" — the date of the event it reports, which can precede `filed_at` by up to four business days. `null` when the header carries none.
          example: '2026-09-16'
        exhibit_url:
          type: string
          format: uri
          nullable: true
          description: The press-release exhibit (EX-99.x) the summary was built from, on sec.gov. `null` when the filing has no such exhibit (the summary then reads the cover document).
          example: https://www.sec.gov/Archives/edgar/data/1045810/000104581026000123/ex99-1.htm
    EnrichedArticle:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/NewsCategory'
        tickers:
          type: array
          items:
            type: string
          description: Validated tickers the article mentions — only symbols present in `/api/symbols/` survive enrichment-time verification against the article text. Mirrors `ai_trading_insights.ticker_analysis[].ticker`.
          example:
          - NVDA
        relevance_score:
          type: integer
          minimum: 1
          maximum: 10
          description: 'How much trading value the article itself carries (rates the

            article, not the company; deterministic — same article, same

            score):

            1–2 no trading relevance · 3–4 derivative content about

            already-known events · 5–6 macro/sector datapoints, minor-but-real

            company news · 7–8 real company news with a fresh catalyst ·

            9–10 primary, material, newly disclosed.

            SEC Form 4 rows are scored from the transaction itself (size,

            buy vs. sell, 10b5-1 plan or not) rather than by the model; a

            sale tops out at 6.

            '
        ai_trading_insights:
          $ref: '#/components/schemas/AITradingInsights'
        news_context_enhancement:
          $ref: '#/components/schemas/NewsContextEnhancement'
