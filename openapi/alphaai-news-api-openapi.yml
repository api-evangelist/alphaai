    OriginalArticle:
      type: object
      description: The article as fetched from the source. `raw_text` is intentionally NOT exposed here.
      required:
      - uid
      - title
      - url
      - summary
      - time_published
      - source
      properties:
        id:
          type: integer
        uid:
          type: string
          pattern: ^[a-f0-9]{16}$
        title:
          type: string
        url:
          type: string
          format: uri
        time_published:
          type: string
          format: date-time
        authors:
          type: array
          items:
            type: string
          description: 'Article authors. On SEC Form 4 rows: every reporting owner of the filing, primary first — a joint filing by a holding vehicle and the person behind it lists both.'
        summary:
          type: string
          description: AI-generated summary safe to redistribute.
        banner_image:
          type: string
          format: uri
          nullable: true
        source:
          type: string
        source_domain:
          type: string
        topics:
          type: array
          items:
