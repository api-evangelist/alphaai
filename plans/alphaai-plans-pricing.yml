generated: '2026-08-11'
method: searched
source: https://alphai.io/pricing
description: >-
  Four published tiers, three of them self-serve with a listed price. The quota
  model is two-layered — a per-minute burst cap AND a per-day volume cap, both of
  which must be under budget for a request to pass — and each tier also gates the
  news-archive horizon and the maximum page size. Free requires no credit card.

currency: USD
billing_periods: [monthly, annual]
annual_discount: '17% (2 months free)'
contract_terms: Month-to-month or annual, no contract, cancel anytime.
plan_count: 4

plans:
  - name: Free
    price: 0
    currency: USD
    period: month
    label: Evaluation / personal non-commercial
    credit_card_required: false
    limits:
      rest_per_minute: 20
      rest_per_day: 100
      mcp_per_minute: 20
      mcp_per_day: 100
      api_keys: 1
      archive_days: 30
      page_size_max: 10
      alerts: 0
    license: Personal, non-commercial use

  - name: Basic
    price: 2.99
    price_annual: 24.92
    currency: USD
    period: month
    status: early access
    limits:
      rest_per_minute: 60
      rest_per_day: 10000
      mcp_per_minute: 60
      mcp_per_day: 10000
      api_keys: 1
      archive_days: 90
      page_size_max: 10
      alerts: 10
      alert_delivery: daily digest
    license: Commercial — internal use only

  - name: Pro
    price: 9.99
    price_annual: 99.90
    currency: USD
    period: month
    status: early access
    most_popular: true
    limits:
      rest_per_minute: 150
      rest_per_day: 100000
      mcp_per_minute: 150
      mcp_per_day: 100000
      api_keys: 5
      archive_days: 180
      page_size_max: 50
      alerts: 50
      alert_delivery: instant, per-article
    features:
      - Webhook delivery (HMAC-signed)
    license: Commercial + in-product redistribution

  - name: Enterprise
    price: null
    pricing_model: contact sales
    limits:
      rest_per_minute: custom
      rest_per_day: custom
      archive_days: full archive
    features:
      - Custom volume
      - Full-archive exports
      - Data-syndication licensing
      - Self-hosted deployments
      - Invoicing
      - Security review
    contact: https://alphai.io/contact

overage:
  model: hard cap
  behavior: >-
    No metered overage. Exceeding either the per-minute or the per-day cap
    returns HTTP 429 with Retry-After and an extra block naming the tier, its
    caps and an upgrade object with the higher tiers' limits plus pricing_url.
    Paging past the tier's archive horizon returns HTTP 403 with
    extra.reason = archive_horizon.

notes:
  - >-
    The license terms are a real tier differentiator, not boilerplate: Free is
    non-commercial, Basic is internal-commercial only, and redistribution of the
    enriched feed is a Pro right. For a news-data API that is the substantive
    difference between tiers, above the rate numbers.
  - >-
    Archive depth was tightened on 2026-07-28 — the changelog records Pro being
    capped at 180 days, where it had previously been unlimited.
