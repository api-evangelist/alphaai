    official: true
    license: MIT
    version: 0.13.0
    published: '2026-08-11'
    downloads: 155
    note: >-
      Terminal dashboard (Rust + ratatui), not a client library — its command
      surface is catalogued in cli/alphaai-cli.yml. Most actively developed of
      the three: released the same day this artifact was written, and the only
      repo with meaningful stars (21).

currency:
