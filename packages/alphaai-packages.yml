    name: alphai-sdk
    url: https://pypi.org/project/alphai-sdk/
    source_code: https://github.com/makeev/alphai-sdk
    install: pip install alphai-sdk
    official: true
    license: MIT
    version: 0.4.2
    published: '2026-08-04'
    requires: '>=3.10'
    releases: 7
    note: >-
      Typed sync + async client with cursor pagination and automatic retries on
      429/5xx. Its PyPI project_urls point back at the OpenAPI
      (api.alphai.io/api/schema/) and the changelog, so the package metadata is
      itself a discovery surface.

  - language: typescript
    registry: npm
    name: alphai-sdk
    url: https://www.npmjs.com/package/alphai-sdk
    source_code: https://github.com/makeev/alphai-ts-sdk
    install: npm install alphai-sdk
    official: true
    license: MIT
    version: 0.4.2
    published: '2026-08-04'
    releases: 8
    runtimes: [node, browser, edge, deno, bun]
    note: >-
      Zero runtime dependencies. Version-locked with the Python SDK — both sat at
      0.4.2 published within six minutes of each other on 2026-08-04, which is a
      deliberate release train rather than two drifting libraries.

  - language: rust
    registry: crates.io
    name: alphai-tui
    url: https://crates.io/crates/alphai-tui
    source_code: https://github.com/makeev/alphai-tui
