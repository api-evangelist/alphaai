  # --- Cross-links from operations to the artifacts that explain them --------
  - target: $.components.responses.RateLimited
    update:
      x-apievangelist-detail: rate-limits/alphaai-rate-limits.yml
  - target: $.components.responses.ArchiveGated
    update:
      x-apievangelist-detail: plans/alphaai-plans-pricing.yml
      x-apievangelist-note: >-
        A quota signal delivered on 403 rather than 429. Discriminate on
        extra.reason == "archive_horizon" so it is not handled as an auth failure.
  - target: $.components.schemas.Error
    update:
      x-apievangelist-detail: errors/alphaai-problem-types.yml
      x-apievangelist-note: >-
        Three alternative message fields (message / detail / error) are in live
        use across different conditions; a client must check all three.
  - target: $.components.schemas.RichNewsArticle
    update:
      x-apievangelist-note: >-
        Also the payload schema of the news.matched.v1 webhook
        (asyncapi/alphaai-webhooks.yml) — data.article is documented as identical
        to the body of GET /api/news/{uid}/.
