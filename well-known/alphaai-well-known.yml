description: >-
  AlphaAI splits its discovery surface across two hosts on purpose: the RFC 9116
  security policy is served from the API host (api.alphai.io) and the OAuth 2.1
  authorization-server + protected-resource metadata (RFC 8414 / RFC 9728) from
  the MCP host (mcp.alphai.io). The marketing host serves nothing — every
  /.well-known/ path on alphai.io returns a Next.js 404 HTML page, so no path on
  that host was counted as a hit.

