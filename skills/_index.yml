quality_notes:
  - >-
    Every skill carries explicit guardrails, and they are the right ones for a
    financial-data product: do not issue buy/sell calls or price targets, say the
    relevance score so the user can calibrate, and state plainly when the feed is
    thin rather than padding. stock-brief also tells the agent to stop rather
    than invent coverage when a ticker comes back unknown.
  - >-
    The skills document real tool semantics that the docs alone do not — that
    alphai_alerts_subscribe is a PARTIAL update preserving omitted fields, that a
    new subscription defaults min_relevance_score to 6, that collapse_stories
    adds a sources_count corroboration signal, and that alphai_actionable_now
    returning empty outside US market hours is expected rather than an error.
  - >-
    The pack covers the alert write path but does not cover the REST-only
    analytics surface (sentiment summaries, insider rollups, per-ticker Form 4
    history), because those endpoints have no MCP tool. See
    mcp/alphaai-tool-crosswalk.yml.
